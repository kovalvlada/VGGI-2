        background-color: #EEEEEE;

</style>

<h2>Surface Model: Cornucopia</h2>

<div id="canvas-holder">
   <canvas width="600" height="600" id="webglcanvas" style="background-color:red"></canvas>
</div>

<div style="margin-top: 10px;">
    <label for="uStepsInput">Деталізація U: <span id="uVal">40</span></label>
    <input type="range" id="uStepsInput" min="5" max="100" value="40" step="1">
    
    <label for="vStepsInput" style="margin-left: 20px;">Деталізація V: <span id="vVal">100</span></label>
    <input type="range" id="vStepsInput" min="5" max="200" value="100" step="1">
